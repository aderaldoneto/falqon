openapi: 3.0.3
info:
  title: Falqon - Seu sistema de reviews e análises
  version: 0.1.0
  description: API para criar, publicar e responder formularios dinamicos.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: System
    description: Estado operacional da API
  - name: Authentication
    description: Autenticacao e sessao administrativa
  - name: Forms
    description: Gerenciamento administrativo de formularios
paths:
  /forms:
    get:
      operationId: listPublishedForms
      summary: Lista os formularios publicados disponiveis para respostas
      tags:
        - Forms
      responses:
        "200":
          description: Formularios publicados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormSummary"
  /forms/{slug}:
    get:
      operationId: getPublicForm
      summary: Busca um formulario publicado pelo slug
      tags:
        - Forms
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Formulario publico
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicForm"
        "404":
          description: Formulario nao encontrado ou nao publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /forms/{slug}/submissions:
    post:
      operationId: createSubmission
      summary: Valida e salva respostas de um formulario publicado
      tags:
        - Forms
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Respostas salvas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionCreated"
        "404":
          description: Formulario nao encontrado ou nao publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Respostas invalidas
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /health:
    get:
      operationId: getHealth
      summary: Consulta a saude da API
      tags:
        - System
      responses:
        "200":
          description: API e banco de dados disponiveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API indisponivel ou sem acesso ao banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google:
    get:
      operationId: beginGoogleLogin
      summary: Inicia o login com Google
      tags:
        - Authentication
      responses:
        "307":
          description: Redireciona para o Google
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
        "503":
          description: Autenticacao Google nao configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: registerUser
      summary: Cadastra um usuario com e-mail e inicia sua sessao
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Usuario cadastrado e autenticado
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: E-mail ja cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Dados de cadastro invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      summary: Finaliza o login com Google
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: falqon_oauth
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redireciona de volta para o frontend
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
        "400":
          description: Callback invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Retorna o usuario autenticado
      tags:
        - Authentication
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sessao autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessao atual
      tags:
        - Authentication
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Sessao encerrada
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
  /admin/forms:
    get:
      operationId: listForms
      summary: Lista os formularios do usuario autenticado
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Formularios do usuario
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FormSummary"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createForm
      summary: Cria um formulario dinamico como rascunho
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormRequest"
      responses:
        "201":
          description: Formulario criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSummary"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug ja utilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Definicao do formulario invalida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/forms/{formId}:
    get:
      operationId: getForm
      summary: Busca um formulario do usuario autenticado para edicao
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Formulario para edicao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicForm"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Formulario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateForm
      summary: Atualiza um formulario em rascunho
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateFormRequest"
      responses:
        "200":
          description: Formulario atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSummary"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Formulario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Slug ja utilizado ou formulario publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Definicao do formulario invalida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/forms/{formId}/publish:
    post:
      operationId: publishForm
      summary: Publica um formulario em rascunho
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Formulario publicado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FormSummary"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Formulario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Estado atual nao permite publicacao
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/forms/{formId}/submissions:
    get:
      operationId: listFormSubmissions
      summary: Lista as respostas de um formulario do usuario autenticado
      tags:
        - Forms
      security:
        - cookieAuth: []
      parameters:
        - name: formId
          in: path
          required: true
          schema:
            type: integer
            format: int64
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Respostas do formulario
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminFormSubmissions"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Formulario nao encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: falqon_session
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
    FormState:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELED
    FormSummary:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - state
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        state:
          $ref: "#/components/schemas/FormState"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PublicForm:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - slug
        - fields
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/PublicFormField"
    PublicFormField:
      type: object
      additionalProperties: false
      required:
        - id
        - type
        - label
        - required
        - configuration
      properties:
        id:
          type: integer
          format: int64
        type:
          $ref: "#/components/schemas/FormFieldType"
        label:
          type: string
        description:
          type: string
        required:
          type: boolean
        configuration:
          type: object
          additionalProperties: true
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - answers
      properties:
        answers:
          type: array
          items:
            $ref: "#/components/schemas/SubmissionAnswer"
    SubmissionAnswer:
      type: object
      additionalProperties: false
      required:
        - field_id
        - value
      properties:
        field_id:
          type: integer
          format: int64
        value: {}
    SubmissionCreated:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    AdminFormSubmissions:
      type: object
      additionalProperties: false
      required:
        - form_id
        - title
        - slug
        - submissions
      properties:
        form_id:
          type: integer
          format: int64
        title:
          type: string
        slug:
          type: string
        submissions:
          type: array
          items:
            $ref: "#/components/schemas/AdminSubmission"
    AdminSubmission:
      type: object
      additionalProperties: false
      required:
        - id
        - created_at
        - answers
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AdminSubmissionAnswer"
    AdminSubmissionAnswer:
      type: object
      additionalProperties: false
      required:
        - field_id
        - field_type
        - label
        - value
      properties:
        field_id:
          type: integer
          format: int64
        field_type:
          $ref: "#/components/schemas/FormFieldType"
        label:
          type: string
        value: {}
    CreateFormRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - slug
        - fields
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 255
        slug:
          type: string
          minLength: 2
          maxLength: 255
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
        description:
          type: string
          maxLength: 2000
        fields:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateFormField"
    CreateFormField:
      type: object
      additionalProperties: false
      required:
        - type
        - label
        - required
        - configuration
      properties:
        type:
          $ref: "#/components/schemas/FormFieldType"
        label:
          type: string
          minLength: 1
          maxLength: 255
        description:
          type: string
          maxLength: 1000
        required:
          type: boolean
        configuration:
          type: object
          additionalProperties: true
    FormFieldType:
      type: string
      enum:
        - SHORT_TEXT
        - LONG_TEXT
        - NUMBER
        - SINGLE_CHOICE
        - MULTIPLE_CHOICE
        - RATING
    Choice:
      type: object
      additionalProperties: false
      required:
        - value
        - label
      properties:
        value:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    TextConfiguration:
      type: object
      additionalProperties: false
      properties:
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 1
    NumberConfiguration:
      type: object
      additionalProperties: false
      properties:
        min:
          type: number
        max:
          type: number
        step:
          type: number
          exclusiveMinimum: true
          minimum: 0
    SingleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
    MultipleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
        min_selections:
          type: integer
          minimum: 0
        max_selections:
          type: integer
          minimum: 1
    RatingConfiguration:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 2
          maximum: 10
