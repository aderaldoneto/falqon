openapi: 3.0.3
info:
  title: Falqon Form Builder API
  version: 0.1.0
  description: API para criar, publicar e responder formularios dinamicos.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: System
    description: Estado operacional da API
  - name: Authentication
    description: Autenticacao e sessao administrativa
paths:
  /health:
    get:
      operationId: getHealth
      summary: Consulta a saude da API
      tags:
        - System
      responses:
        "200":
          description: API e banco de dados disponiveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API indisponivel ou sem acesso ao banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google:
    get:
      operationId: beginGoogleLogin
      summary: Inicia o login com Google
      tags:
        - Authentication
      responses:
        "307":
          description: Redireciona para o Google
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
        "503":
          description: Autenticacao Google nao configurada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/register:
    post:
      operationId: registerUser
      summary: Cadastra um usuario com e-mail e inicia sua sessao
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterUserRequest"
      responses:
        "201":
          description: Usuario cadastrado e autenticado
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "409":
          description: E-mail ja cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Dados de cadastro invalidos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/google/callback:
    get:
      operationId: completeGoogleLogin
      summary: Finaliza o login com Google
      tags:
        - Authentication
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: error
          in: query
          required: false
          schema:
            type: string
        - name: falqon_oauth
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redireciona de volta para o frontend
          headers:
            Location:
              required: true
              schema:
                type: string
                format: uri
            Set-Cookie:
              required: true
              schema:
                type: string
        "400":
          description: Callback invalido
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/session:
    get:
      operationId: getAuthSession
      summary: Retorna o usuario autenticado
      tags:
        - Authentication
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Sessao autenticada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Sessao ausente ou expirada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logout
      summary: Encerra a sessao atual
      tags:
        - Authentication
      security:
        - cookieAuth: []
      parameters:
        - name: falqon_session
          in: cookie
          required: false
          schema:
            type: string
      responses:
        "204":
          description: Sessao encerrada
          headers:
            Set-Cookie:
              required: true
              schema:
                type: string
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: falqon_session
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    User:
      type: object
      additionalProperties: false
      required:
        - id
        - name
        - email
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        email:
          type: string
          format: email
    RegisterUserRequest:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - password
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 160
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
    FormState:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELED
    FormFieldType:
      type: string
      enum:
        - SHORT_TEXT
        - LONG_TEXT
        - NUMBER
        - SINGLE_CHOICE
        - MULTIPLE_CHOICE
        - RATING
    Choice:
      type: object
      additionalProperties: false
      required:
        - value
        - label
      properties:
        value:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    TextConfiguration:
      type: object
      additionalProperties: false
      properties:
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 1
    NumberConfiguration:
      type: object
      additionalProperties: false
      properties:
        min:
          type: number
        max:
          type: number
        step:
          type: number
          exclusiveMinimum: true
          minimum: 0
    SingleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
    MultipleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
        min_selections:
          type: integer
          minimum: 0
        max_selections:
          type: integer
          minimum: 1
    RatingConfiguration:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 2
          maximum: 10
