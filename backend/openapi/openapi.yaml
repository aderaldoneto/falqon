openapi: 3.0.3
info:
  title: Falqon Form Builder API
  version: 0.1.0
  description: API para criar, publicar e responder formularios dinamicos.
servers:
  - url: http://localhost:8080
    description: Ambiente local
tags:
  - name: System
    description: Estado operacional da API
paths:
  /health:
    get:
      operationId: getHealth
      summary: Consulta a saude da API
      tags:
        - System
      responses:
        "200":
          description: API e banco de dados disponiveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: API indisponivel ou sem acesso ao banco
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ok
    ErrorResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
    FormState:
      type: string
      enum:
        - DRAFT
        - PUBLISHED
        - CANCELED
    FormFieldType:
      type: string
      enum:
        - SHORT_TEXT
        - LONG_TEXT
        - NUMBER
        - SINGLE_CHOICE
        - MULTIPLE_CHOICE
        - RATING
    Choice:
      type: object
      additionalProperties: false
      required:
        - value
        - label
      properties:
        value:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
    TextConfiguration:
      type: object
      additionalProperties: false
      properties:
        min_length:
          type: integer
          minimum: 0
        max_length:
          type: integer
          minimum: 1
    NumberConfiguration:
      type: object
      additionalProperties: false
      properties:
        min:
          type: number
        max:
          type: number
        step:
          type: number
          exclusiveMinimum: true
          minimum: 0
    SingleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
    MultipleChoiceConfiguration:
      type: object
      additionalProperties: false
      required:
        - choices
      properties:
        choices:
          type: array
          minItems: 2
          items:
            $ref: "#/components/schemas/Choice"
        min_selections:
          type: integer
          minimum: 0
        max_selections:
          type: integer
          minimum: 1
    RatingConfiguration:
      type: object
      additionalProperties: false
      required:
        - min
        - max
      properties:
        min:
          type: integer
          minimum: 1
        max:
          type: integer
          minimum: 2
          maximum: 10
