services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-falqon}
      POSTGRES_USER: ${POSTGRES_USER:-falqon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-falqon}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/seeds:/seeds:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-falqon} -d ${POSTGRES_DB:-falqon}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
      target: development
    environment:
      ADDRESS: 0.0.0.0:8080
      DATABASE_URL: postgres://${POSTGRES_USER:-falqon}:${POSTGRES_PASSWORD:-falqon}@db:5432/${POSTGRES_DB:-falqon}?sslmode=disable
      WEB_URL: ${WEB_URL:-http://localhost:5173}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-http://localhost:8080/auth/google/callback}
      SESSION_SECRET: ${SESSION_SECRET:-change-me-with-at-least-32-characters}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./backend:/app
      - go_modules:/go/pkg/mod
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: development
    environment:
      VITE_API_URL: http://localhost:${API_PORT:-8080}
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_modules:/app/node_modules
      - ./backend/openapi:/openapi:ro
    depends_on:
      - api

volumes:
  postgres_data:
  go_modules:
  frontend_modules:
